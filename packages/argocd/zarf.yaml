kind: ZarfPackageConfig
metadata:
  name: platform-argocd
  description: "Argo CD GitOps engine packaged for air-gapped IL5 environments"
  version: "0.1.0"
  architecture: amd64

variables:
  - name: ARGOCD_ADMIN_PASSWORD
    description: "Initial admin password for Argo CD"
    default: "argocd-admin-secret"
    prompt: true

components:
  - name: argocd
    required: true
    charts:
      - name: argo-cd
        url: https://argoproj.github.io/argo-helm
        version: "5.51.6"
        namespace: argocd
        valuesFiles:
          - values.yaml
    images:
      - quay.io/argoproj/argocd:v2.9.3
      - ghcr.io/dexidp/dex:v2.37.0
      - public.ecr.aws/docker/library/redis:7.0.13-alpine
