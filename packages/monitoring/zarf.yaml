kind: ZarfPackageConfig
metadata:
  name: platform-monitoring
  description: "Prometheus, Grafana, Alertmanager & Exporters for air-gapped IL5 environments"
  version: "0.1.0"
  architecture: amd64

variables:
  - name: MONITORING_NAMESPACE
    description: "Namespace to deploy monitoring stack"
    default: "monitoring"
  - name: GRAFANA_ADMIN_PASSWORD
    description: "Grafana admin password"
    generate:
      length: 32
      character-sets: ["alphanumeric", "symbols"]

components:
  - name: kube-prometheus-stack
    required: true
    charts:
      - name: kube-prometheus-stack
        url: https://prometheus-community.github.io/helm-charts
        version: "55.0.0"
        namespace: "###ZARF_VAR_MONITORING_NAMESPACE###"
        valuesFiles:
          - values.yaml
    images:
      - quay.io/prometheus/prometheus:v2.48.0
      - quay.io/prometheus/alertmanager:v0.26.0
      - quay.io/prometheus/node-exporter:v1.7.0
      - registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
      - docker.io/grafana/grafana:10.2.2
      - quay.io/kiwigrid/k8s-sidecar:1.25.3
      - quay.io/prometheus-operator/prometheus-operator:v0.70.0
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.70.0
