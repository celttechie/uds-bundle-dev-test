# kube-prometheus-stack Hardened Values for Air-Gap and IL5 Compliance
prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

grafana:
  enabled: true
  adminPassword: "###ZARF_VAR_GRAFANA_ADMIN_PASSWORD###"
  defaultDashboardsEnabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  service:
    type: ClusterIP
    port: 80

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
