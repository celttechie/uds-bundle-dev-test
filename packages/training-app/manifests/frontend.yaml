apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: training-app
  labels:
    app: frontend
    app.kubernetes.io/part-of: training-workload
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: training-app
  labels:
    app: frontend
    app.kubernetes.io/part-of: training-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: training-workload
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
