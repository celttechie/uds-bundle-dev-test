apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: training-app
  labels:
    app: queue-worker
    app.kubernetes.io/part-of: training-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
        app.kubernetes.io/part-of: training-workload
    spec:
      containers:
        - name: queue-worker
          image: python:3.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -c
            - |
              cat << 'EOF' > /tmp/worker.py
              import time
              import os

              print("Starting queue-worker processor...")
              while True:
                  print("Processing job from queue: OK")
                  time.sleep(10)
              EOF
              python3 /tmp/worker.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
