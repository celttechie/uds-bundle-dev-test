# UDS Platform Bundle Definition
kind: UDSBundle
metadata:
  name: airgap-platform-stack
  description: "Air-gapped DoD IL5 platform bundle containing Argo CD, Observability, and Training App workloads"
  version: "0.1.0"
  architecture: amd64
  authors: "Platform & Security Engineering Team"

packages:
  # 1. Argo CD GitOps Engine
  - name: platform-argocd
    ref: "0.1.0"
    path: ../packages/argocd

  # 2. Observability Stack (Prometheus, Grafana, Alertmanager)
  - name: platform-monitoring
    ref: "0.1.0"
    path: ../packages/monitoring

  # 3. Mission / Training Microservices Workload
  - name: platform-training-app
    ref: "0.1.0"
    path: ../packages/training-app
