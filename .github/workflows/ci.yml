name: CI & Compliance Validation Workflow

on:
  push:
    branches: [ main, "feat/**", "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  LULA_VERSION: v0.8.0

jobs:
  static-checks:
    name: Lint, Static Checks & Shift-Left Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml ruff

      - name: Install Defense Unicorns Lula CLI
        run: |
          curl -sSL "https://github.com/defenseunicorns-labs/lula1/releases/download/${LULA_VERSION}/lula_${LULA_VERSION}_Linux_amd64" -o /usr/local/bin/lula
          chmod +x /usr/local/bin/lula
          lula version

      - name: Validate OSCAL Component & Assessment Models with Lula CLI
        run: |
          lula tools lint -f docs/compliance/oscal-il5.yaml,docs/compliance/assessment-results.yaml

      - name: Lint Shell Scripts with ShellCheck
        run: |
          shellcheck scripts/*.sh

      - name: Lint & Compile Python Modules
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          ruff check --select E,F,W --ignore E501 scripts/ tests/

      - name: Validate Zarf, UDS Bundle, K8s Manifests & OSCAL Schema
        run: |
          python3 -c '
          import pathlib, yaml
          for pattern in ["bundles/*.yaml", "packages/**/*.yaml", "docs/compliance/*.yaml"]:
              for path in sorted(pathlib.Path(".").glob(pattern)):
                  docs = list(yaml.safe_load_all(path.read_text()))
                  assert len(docs) > 0, f"Empty YAML file: {path}"
                  print(f"Validated YAML: {path} ({len(docs)} document(s))")
          '

      - name: Run Automated Unit & Shift-Left IL5 Compliance Tests
        run: |
          make test
          make drill-list > /dev/null
          make drill-cheatsheet > /dev/null

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  runtime-compliance:
    name: Ephemeral KinD Runtime Lula Compliance Gate
    runs-on: ubuntu-latest
    needs: [ static-checks ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Set up KinD Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind-lula-ci
          wait: 120s

      - name: Install Defense Unicorns Lula CLI
        run: |
          curl -sSL "https://github.com/defenseunicorns-labs/lula1/releases/download/${LULA_VERSION}/lula_${LULA_VERSION}_Linux_amd64" -o /usr/local/bin/lula
          chmod +x /usr/local/bin/lula
          lula version

      - name: Deploy Training App Workloads to Ephemeral Cluster
        run: |
          kubectl apply -f packages/training-app/manifests/namespace.yaml
          kubectl apply -f packages/training-app/manifests/
          # Wait up to 60s for order-api deployment availability
          kubectl rollout status deployment/order-api -n training-app --timeout=60s || true
          kubectl get all,netpol -n training-app

      - name: Execute Live Lula DoD IL5 Runtime Validation
        run: |
          lula validate -f docs/compliance/oscal-il5.yaml -o /tmp/lula-runtime-assessment.yaml

      - name: Evaluate OSCAL Compliance Controls Against IL5 Baseline
        run: |
          python3 -c '
          import yaml, sys
          data = yaml.safe_load(open("/tmp/lula-runtime-assessment.yaml"))
          results = data.get("assessment-results", {}).get("results", [])
          if not results:
              print("Error: No assessment results generated by Lula!", file=sys.stderr)
              sys.exit(1)

          failed = []
          for res in results:
              for finding in res.get("findings", []):
                  target_id = finding.get("target", {}).get("target-id", "unknown")
                  state = finding.get("target", {}).get("status", {}).get("state", "unknown")
                  if state != "satisfied":
                      failed.append((target_id, state))

          if failed:
              print(f"❌ COMPLIANCE REGRESSION: Unsatisfied Lula controls: {failed}", file=sys.stderr)
              sys.exit(1)

          print("✅ All NIST SP 800-53 Rev 5 Lula controls are SATISFIED at runtime!")
          '

      - name: Upload OSCAL Assessment Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscal-runtime-assessment-results
          path: /tmp/lula-runtime-assessment.yaml
